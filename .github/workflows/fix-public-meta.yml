name: Fix GrantOps public export metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-public-meta.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align metadata with canonical export policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/public.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          d.setdefault('meta', {})['export_policy'] = 'Public operational fields only; private contact IDs, personal contact details, owners, document IDs and internal notes are excluded.'
          d['meta']['outreach_updated_at'] = '2026-08-11T10:14:12+02:00'
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name "GrantOps Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/public.json
          git diff --cached --quiet && exit 0
          git commit -m "Align public GrantOps export metadata"
          git push
