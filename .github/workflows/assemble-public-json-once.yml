name: Assemble GrantOps public snapshot once

on:
  push:
    branches: [main]
    paths:
      - 'data/sync-parts/**'
      - '.github/workflows/assemble-public-json-once.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble and validate snapshot
        run: |
          cat data/sync-parts/part-*.txt > data/public.json
          python -m json.tool data/public.json > /dev/null
      - name: Commit snapshot
        run: |
          git config user.name 'GrantOps Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/public.json
          git diff --cached --quiet && exit 0
          git commit -m 'Sync public GrantOps data'
          git push
