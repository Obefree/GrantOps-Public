name: Merge live GrantOps overrides once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-live-overrides-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public pages to merge live overrides
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'marker not found in {path}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          patch('index.html',
            "fetch('./data/public.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('snapshot');return r.json()}).then(x=>{D=x;render()}).catch(()=>{document.getElementById('sync-label').textContent='Snapshot unavailable';render()});",
            "Promise.all([fetch('./data/public.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('snapshot');return r.json()}),fetch('./data/live-overrides.json',{cache:'no-store'}).then(r=>r.ok?r.json():{opportunities:[]}).catch(()=>({opportunities:[]}))]).then(([x,o])=>{const m=new Map((x.opportunities||[]).map(v=>[v.opportunity_id,v]));(o.opportunities||[]).forEach(v=>m.set(v.opportunity_id,{...(m.get(v.opportunity_id)||{}),...v}));x.opportunities=[...m.values()];if(o.generated_at)x.meta={...(x.meta||{}),generated_at:o.generated_at,source_updated_at:o.generated_at.slice(0,10)};D=x;render()}).catch(()=>{document.getElementById('sync-label').textContent='Snapshot unavailable';render()});")

          patch('partner/index.html',
            "fetch('../data/public.json',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>document.getElementById('opps').innerHTML='<div class=\"empty\" style=\"color:#b42318\">Could not load GrantOps data.</div>');",
            "Promise.all([fetch('../data/public.json',{cache:'no-store'}).then(r=>r.json()),fetch('../data/live-overrides.json',{cache:'no-store'}).then(r=>r.ok?r.json():{opportunities:[]}).catch(()=>({opportunities:[]}))]).then(([d,o])=>{const m=new Map((d.opportunities||[]).map(v=>[v.opportunity_id,v]));(o.opportunities||[]).forEach(v=>m.set(v.opportunity_id,{...(m.get(v.opportunity_id)||{}),...v}));d.opportunities=[...m.values()];render(d)}).catch(()=>document.getElementById('opps').innerHTML='<div class=\"empty\" style=\"color:#b42318\">Could not load GrantOps data.</div>');")
          PY
      - name: Commit page patches
        run: |
          git config user.name "GrantOps Site"
          git config user.email "actions@users.noreply.github.com"
          git add index.html partner/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Load current GrantOps funding overrides"
          git push
