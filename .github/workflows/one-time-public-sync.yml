name: One-time GrantOps public sync
on:
  push:
    paths:
      - '.github/workflows/one-time-public-sync.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch public export to canonical public-safe state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          p = Path('data/public.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          eic = {
            "opportunity_id": "OPP-EU-EIC-ACCELERATOR-2026",
            "name": "EIC Accelerator 2026 – Open / Challenges",
            "funder_organisation_id": "ORG-EU-EIC",
            "programme": "Horizon Europe / European Innovation Council",
            "opportunity_type": "scaleup_grant_and_equity",
            "status": "screening",
            "opening_date": "2026-01-01",
            "deadline": "2026-11-04",
            "funding_min_eur": "",
            "funding_max_eur": "2500000",
            "cofunding_rate": "grant below EUR 2.5m; equity EUR 1m-10m",
            "geographic_scope": "EU and Horizon Europe associated countries",
            "eligible_countries": "EU Member States and Horizon Europe associated countries",
            "eligible_entity_types": "single startup or SME; small mid-cap for investment-only",
            "consortium_required": "no",
            "minimum_partners": "1",
            "topic_tags": "EIC,deep_tech,TRL6,TRL7,TRL8,AI,software,data,scaleup,commercialisation",
            "language_environments": "English",
            "eligibility_summary": "TRL 6-8 scale-up route. Grant below EUR 2.5m; investment EUR 1m-10m. Short proposals are continuous; remaining full-proposal batches are 2 Sep and 4 Nov 2026.",
            "project_fit": "Potential direct route only if the company can evidence TRL 6+, defensible innovation, market disruption and scale-up ambition.",
            "recommended_role": "single SME applicant",
            "source_url": "https://eic.ec.europa.eu/eic-funding-opportunities/eic-accelerator_en",
            "last_verified_at": "2026-09-01",
            "verification_status": "verified_official",
            "next_action": "Run a hard EIC fit screen; if credible prepare the short proposal for the next monthly batch. If a Step-1 GO already exists, use the 2 Sep full-proposal batch.",
            "next_action_date": "2026-09-03"
          }

          opps = data.get('opportunities', [])
          replaced = False
          for i, row in enumerate(opps):
            if row.get('opportunity_id') == eic['opportunity_id']:
              opps[i] = eic
              replaced = True
              break
          if not replaced:
            opps.append(eic)

          for row in opps:
            if row.get('opportunity_id') == 'OPP-UN-UNDEF-2026':
              row['last_verified_at'] = '2026-09-01'
              row['next_action'] = 'Monitor official announcement and identify an NGO lead before the window opens.'
              row['next_action_date'] = '2026-09-08'

          # Preserve the CCR language policy exactly.
          for project in data.get('projects', []):
            if project.get('short_name') == 'CCR':
              langs = [x.strip() for x in project.get('language_workstreams', '').split(',') if x.strip()]
              if 'Portuguese' not in langs:
                langs.insert(1 if langs else 0, 'Portuguese')
              project['language_workstreams'] = ','.join(dict.fromkeys(langs))

          data.setdefault('meta', {})['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          data['meta']['source_updated_at'] = '2026-09-01'
          data['meta']['source'] = 'Obefree/GrantOps private canonical database'
          data['meta']['export_policy'] = 'Public operational fields only; private contact IDs, personal contact details, owners, document IDs and internal notes are excluded.'

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit public data if changed
        shell: bash
        run: |
          if git diff --quiet -- data/public.json; then
            exit 0
          fi
          git config user.name "GrantOps Public Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/public.json
          git commit -m "Sync canonical GrantOps public data"
          git push
