name: Add opportunities tag filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-tag-filter.yml'

permissions:
  contents: write

jobs:
  update-tag-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main dashboard tag filter
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.filters{display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(150px,1fr));gap:8px;margin:13px 0}'
          new='.filters{display:grid;grid-template-columns:minmax(260px,2fr) repeat(4,minmax(150px,1fr));gap:8px;margin:13px 0}'
          if old not in s: raise SystemExit('CSS marker not found')
          s=s.replace(old,new,1)

          old='<div class="filters"><input id="q" placeholder="Search call, programme, role, topic…"><select id="programme"><option value="">All programmes</option></select><select id="status"><option value="">All statuses</option></select><select id="geo"><option value="">All geographies</option></select></div>'
          new='<div class="filters"><input id="q" placeholder="Search call, programme, role, topic…"><select id="programme"><option value="">All programmes</option></select><select id="status"><option value="">All statuses</option></select><select id="geo"><option value="">All geographies</option></select><select id="tag"><option value="">All tags</option></select></div>'
          if old not in s: raise SystemExit('Filter markup marker not found')
          s=s.replace(old,new,1)

          old="fill('programme',uniq(opp.map(o=>o.programme)));fill('status',uniq(opp.map(o=>o.status)));fill('geo',uniq(opp.map(o=>o.geographic_scope)));"
          new="fill('programme',uniq(opp.map(o=>o.programme)));fill('status',uniq(opp.map(o=>o.status)));fill('geo',uniq(opp.map(o=>o.geographic_scope)));fill('tag',uniq(opp.flatMap(o=>String(o.topic_tags||'').split(',').map(x=>x.trim()).filter(Boolean))));"
          if old not in s: raise SystemExit('Fill marker not found')
          s=s.replace(old,new,1)

          old="const apply=()=>{const q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('programme').value,s=document.getElementById('status').value,g=document.getElementById('geo').value;const rows=opp.filter(o=>(!p||o.programme===p)&&(!s||o.status===s)&&(!g||o.geographic_scope===g)&&(!q||JSON.stringify(o).toLowerCase().includes(q))).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));document.getElementById('opp-table').innerHTML=oppTable(rows);};"
          new="const apply=()=>{const q=document.getElementById('q').value.toLowerCase(),p=document.getElementById('programme').value,s=document.getElementById('status').value,g=document.getElementById('geo').value,t=document.getElementById('tag').value;const rows=opp.filter(o=>(!p||o.programme===p)&&(!s||o.status===s)&&(!g||o.geographic_scope===g)&&(!t||String(o.topic_tags||'').split(',').map(x=>x.trim()).includes(t))&&(!q||JSON.stringify(o).toLowerCase().includes(q))).sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));document.getElementById('opp-table').innerHTML=oppTable(rows);};"
          if old not in s: raise SystemExit('Apply marker not found')
          s=s.replace(old,new,1)

          old="['q','programme','status','geo'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',apply));apply();"
          new="['q','programme','status','geo','tag'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',apply));apply();"
          if old not in s: raise SystemExit('Listener marker not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit tag filter
        run: |
          git config user.name "GrantOps Site"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add tag filter to opportunities"
          git push
