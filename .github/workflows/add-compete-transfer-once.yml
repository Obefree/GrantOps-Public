name: Add COMPETE knowledge-transfer opportunity once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-compete-transfer-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/public.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          oid='OPP-PT-COMPETE-KNOWLEDGE-TRANSFER-2026'
          if not any(o.get('opportunity_id')==oid for o in d.get('opportunities',[])):
              d.setdefault('opportunities',[]).append({
                'opportunity_id': oid,
                'name': 'Ações Coletivas – Transferência do conhecimento científico e tecnológico',
                'funder_organisation_id': 'ORG-PT-COMPETE',
                'programme': 'Portugal 2030 / COMPETE 2030',
                'opportunity_type': 'collective_action_grant',
                'status': 'qualified',
                'opening_date': '2026-08-12',
                'deadline': '2026-10-15',
                'funding_min_eur': '350000',
                'funding_max_eur': '1200000',
                'cofunding_rate': '85%',
                'geographic_scope': 'Portugal mainland: Norte, Centro, Alentejo',
                'eligible_countries': 'Portugal',
                'eligible_entity_types': 'Recognised CoLAB and CTI only; IT companies are not direct beneficiaries',
                'consortium_required': 'yes',
                'minimum_partners': '1',
                'topic_tags': 'knowledge_transfer,digital_platforms,open_innovation,technology_transfer,co_creation,R&D,AI,data,software,SME_engagement',
                'language_environments': 'Portuguese,English; multilingual validation/tooling possible where relevant',
                'eligibility_summary': 'Open 12 Aug–15 Oct 2026 17:00. EUR 45m FEDER budget, up to 85% co-financing. Only recognised CoLABs/CTIs in Norte, Centro and Alentejo may apply. Individual eligible investment EUR 350k–500k; co-promotion EUR 350k–1.2m per co-promoter and at least EUR 1.2m per operation. Outputs must be collective and broadly accessible.',
                'project_fit': 'Partner-led route rather than direct company grant. Strong fit for digital knowledge-transfer platforms, pilot demonstrators, open-innovation/co-creation environments and structured science-to-company matching using CCR/news-analysis/media-literacy or broader web/app/AI/data tooling.',
                'recommended_role': 'technical co-developer / platform work-package contributor / company cooperation partner to a CTI or CoLAB lead',
                'source_url': 'https://portugal2030.pt/wp-content/uploads/sites/3/2026/08/Aviso_SIAC_Transferencia_COMPETE_11082026_vf.pdf',
                'last_verified_at': '2026-08-24',
                'verification_status': 'verified_official',
                'next_action': 'Identify 3–5 recognised digital/AI/software-oriented CTI or CoLAB leads in Norte/Centro and pitch a collective digital-platform or demonstrator component; confirm procurement/subcontracting versus cooperation structure.',
                'next_action_date': '2026-08-27'
              })
          d.setdefault('meta',{})['generated_at']=datetime.now(timezone.utc).isoformat()
          d['meta']['source_updated_at']='2026-08-24'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit snapshot
        run: |
          git config user.name "GrantOps Sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/public.json
          git diff --cached --quiet && exit 0
          git commit -m "Add COMPETE knowledge-transfer opportunity"
          git push
