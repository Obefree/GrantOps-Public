name: Apply GrantOps public sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-grantops-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild public JSON from staged chunks
        run: |
          cat data-sync/part-* > data/public.json
          python -m json.tool data/public.json > /dev/null
      - name: Commit public snapshot
        run: |
          git config user.name 'GrantOps Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/public.json
          if git diff --cached --quiet; then
            echo 'No public data changes'
            exit 0
          fi
          git commit -m 'Sync public GrantOps data'
          git push
