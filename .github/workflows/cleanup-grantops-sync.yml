name: Cleanup GrantOps sync transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-grantops-sync.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary sync transport
        run: |
          git rm -r data-sync
          git rm .github/workflows/apply-grantops-sync.yml
          git rm .github/workflows/cleanup-grantops-sync.yml
          git config user.name 'GrantOps Sync'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Remove temporary GrantOps sync transport'
          git push
