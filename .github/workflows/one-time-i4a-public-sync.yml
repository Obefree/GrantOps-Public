name: One-time Innovation4Albania public sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-i4a-public-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public-safe snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path('data/public.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          data.setdefault('meta', {})['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          data['meta']['source_updated_at'] = '2026-08-31'
          data['meta']['outreach_updated_at'] = '2026-08-31T10:37:58+00:00'
          data['meta']['source'] = 'Obefree/GrantOps private canonical database'
          data['meta']['export_policy'] = 'Public operational fields only; private contact IDs, personal contact details, owners, document IDs and internal notes are excluded.'

          for project in data.get('projects', []):
              if project.get('short_name') == 'CCR':
                  langs = [x.strip() for x in project.get('language_workstreams', '').split(',') if x.strip()]
                  if 'Portuguese' not in langs:
                      langs.insert(1 if langs else 0, 'Portuguese')
                  project['language_workstreams'] = ','.join(dict.fromkeys(langs))

          for opp in data.get('opportunities', []):
              if opp.get('opportunity_id') == 'DIGITAL-2026-SKILLS-10-EDTECH-I4A':
                  opp['project_fit'] = 'Innovation4Albania is now engaged; use the confirmed call to clarify whether they are forming or joining an EdTech Accelerator consortium and to explore broader Albanian pilot and future EU-project cooperation.'
                  opp['last_verified_at'] = '2026-08-31'
                  opp['next_action'] = 'Hold the 1 Sep 2026 13:00 CEST discovery call; identify consortium status, coordinator introductions and one concrete next step.'
                  opp['next_action_date'] = '2026-09-01'

          data.setdefault('organisations', {})['ORG-AL-I4A'] = {
              'organisation_id': 'ORG-AL-I4A',
              'name': 'Innovation4Albania',
              'country': 'Albania',
              'city': 'Tirana',
              'website': 'https://www.startupalbania.gov.al/',
              'organisation_types': 'public_body,innovation_agency',
              'general_roles': 'partner,consortium_partner,pilot_partner,ecosystem_connector,public_authority',
              'focus_tags': 'innovation,EdTech,EU_projects,startups,digital_skills,education',
              'programme_tags': 'Digital_Europe,Horizon_Europe,national_innovation',
              'language_environments': 'Albanian,English',
              'source_url': 'https://www.startupalbania.gov.al/',
              'last_verified_at': '2026-08-31',
              'verification_status': 'verified_official',
              'status': 'active'
          }

          rel = {
              'relationship_id': 'REL-CCR-AL-I4A',
              'project_id': 'PRJ-CCR',
              'organisation_id': 'ORG-AL-I4A',
              'relationship_roles': 'partner,consortium_partner,pilot_partner,ecosystem_connector',
              'priority': 'P1',
              'fit_score': '5',
              'stage': 'meeting_scheduled',
              'entry_angle': 'Use the 1 September call to understand their current DIGITAL-2026-SKILLS-10-EDTECH position first; then explore Albanian pilot, localisation, ecosystem introductions and future EU/national projects.',
              'value_for_project': 'Institutional Albanian partner, local innovation ecosystem, potential pilot access, consortium introductions and EU-project capability.',
              'value_for_organisation': 'Working EdTech and critical-thinking products, technology/product development, multilingual adaptation, analytics and measurable pilot design.',
              'next_action': 'Hold discovery call and secure one concrete next step.',
              'next_action_date': '2026-09-01',
              'updated_at': '2026-08-31'
          }
          relationships = data.setdefault('relationships', [])
          relationships[:] = [r for r in relationships if r.get('relationship_id') != rel['relationship_id']]
          relationships.append(rel)

          route = {
              'route_id': 'RTE-CCR-AL-I4A-20260831',
              'project_id': 'PRJ-CCR',
              'organisation_id': 'ORG-AL-I4A',
              'opportunity_id': 'DIGITAL-2026-SKILLS-10-EDTECH-I4A',
              'status': 'meeting_scheduled',
              'priority': 'P1',
              'last_signal': 'Innovation4Albania expressed interest in current or future collaboration and confirmed a call for 1 September 2026 at 13:00 CEST.',
              'next_action': 'Hold discovery call; clarify current DIGITAL-2026-SKILLS-10-EDTECH consortium status and map broader EU or national collaboration routes.',
              'next_action_date': '2026-09-01',
              'updated_at': '2026-08-31'
          }
          routes = data.setdefault('routes', [])
          routes[:] = [r for r in routes if r.get('route_id') != route['route_id']]
          routes.append(route)

          new_interactions = [
              {
                  'interaction_id': 'INT-CCR-AL-I4A-MEETING-20260831',
                  'project_id': 'PRJ-CCR',
                  'organisation_id': 'ORG-AL-I4A',
                  'opportunity_id': 'DIGITAL-2026-SKILLS-10-EDTECH-I4A',
                  'interaction_type': 'email_received',
                  'occurred_at': '2026-08-31T10:37:58+00:00',
                  'direction': 'incoming',
                  'subject': 'RE: DIGITAL-2026-SKILLS-10-EDTECH — possible consortium connection',
                  'summary': 'Innovation4Albania confirmed the proposed meeting time for 1 September 2026 at 13:00 CEST.',
                  'outcome': 'meeting_confirmed',
                  'next_action': 'Hold meeting; identify concrete next step and relevant consortium or programme route.',
                  'next_action_date': '2026-09-01'
              },
              {
                  'interaction_id': 'INT-CCR-AL-I4A-REPLY-20260831',
                  'project_id': 'PRJ-CCR',
                  'organisation_id': 'ORG-AL-I4A',
                  'opportunity_id': 'DIGITAL-2026-SKILLS-10-EDTECH-I4A',
                  'interaction_type': 'email_received',
                  'occurred_at': '2026-08-31T09:35:16+00:00',
                  'direction': 'incoming',
                  'subject': 'RE: DIGITAL-2026-SKILLS-10-EDTECH — possible consortium connection',
                  'summary': 'Innovation4Albania expressed interest in learning more about the work and exploring current or future collaboration; a call was proposed.',
                  'outcome': 'call_requested',
                  'next_action': 'Schedule discovery call and clarify collaboration routes.',
                  'next_action_date': '2026-09-01'
              }
          ]
          ids = {i['interaction_id'] for i in new_interactions}
          interactions = data.setdefault('interactions', [])
          interactions[:] = [i for i in interactions if i.get('interaction_id') not in ids]
          interactions.extend(new_interactions)
          interactions.sort(key=lambda r: r.get('occurred_at', ''), reverse=True)

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit public snapshot if changed
        run: |
          git config user.name 'GrantOps Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/public.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Sync Innovation4Albania public operational data'
          git push
