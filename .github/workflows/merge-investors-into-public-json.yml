name: Merge investors into public snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/merge-investors-into-public-json.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge canonical public investor register
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          public_path = Path('data/public.json')
          investors_path = Path('investors/data.json')
          public = json.loads(public_path.read_text(encoding='utf-8'))
          investor_payload = json.loads(investors_path.read_text(encoding='utf-8'))
          investors = investor_payload.get('investors', [])
          public['investors'] = investors
          latest_investor = max((x.get('last_verified_at', '') for x in investors), default='')
          if latest_investor > public.get('meta', {}).get('source_updated_at', ''):
              public['meta']['source_updated_at'] = latest_investor
          public['meta']['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          public_path.write_text(json.dumps(public, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit merged public snapshot
        run: |
          git config user.name 'GrantOps Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add data/public.json
          if git diff --cached --quiet; then
            echo 'No public data changes'
            exit 0
          fi
          git commit -m 'Sync investor register into public GrantOps data'
          git push
