<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrantOps — Mini grants</title><style>body{margin:0;background:#f4f6fa;color:#172033;font:14px/1.5 Inter,system-ui,sans-serif}header{background:#10233f;color:white;padding:28px 5vw}header h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#d9e4f5;max-width:900px}.wrap{max-width:1450px;margin:auto;padding:20px 5vw 50px}.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.nav a{color:#315efb;text-decoration:none;background:white;border:1px solid #e3e8f0;border-radius:9px;padding:8px 11px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin:12px 0}.filters input,.filters select{padding:10px;border:1px solid #dfe5ee;border-radius:9px;background:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.card{background:white;border:1px solid #e3e8f0;border-radius:14px;padding:16px}.top{display:flex;justify-content:space-between;gap:10px}.card h2{font-size:16px;margin:0}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;background:#eef2ff;color:#2949bd;font-size:10px}.P1{background:#fff0d9;color:#8b5700}.P2{background:#eef2ff;color:#2949bd}.P3{background:#f3f4f6;color:#667085}.meta{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.row{margin:7px 0;color:#475467}.next{border-top:1px solid #edf0f5;margin-top:10px;padding-top:10px}.source{margin-top:9px}.source a{color:#315efb}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.metric{background:white;border:1px solid #e3e8f0;border-radius:12px;padding:13px}.metric b{font-size:22px;display:block}.metric span{color:#667085;font-size:11px}@media(max-width:750px){.filters{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Mini grants</h1><p>Focused low-friction funding pipeline: small grants, vouchers and cascade opportunities where the objective is to get a first award quickly. Slovenia is prioritised.</p></header><main class="wrap"><div class="nav"><a href="../">← GrantOps</a><span id="sync">Loading…</span></div><div class="metrics" id="metrics"></div><div class="filters"><input id="q" placeholder="Search…"><select id="country"><option value="">All countries</option></select><select id="priority"><option value="">All priorities</option></select><select id="status"><option value="">All statuses</option></select></div><div class="cards" id="cards"></div></main><script>let D=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uniq=a=>[...new Set(a.filter(Boolean))].sort();function fill(id,vals){const e=document.getElementById(id);vals.forEach(v=>e.insertAdjacentHTML('beforeend',`<option>${esc(v)}</option>`))}function render(){const q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('country').value,p=document.getElementById('priority').value,s=document.getElementById('status').value;const rows=D.filter(x=>(!c||x.country===c)&&(!p||x.priority===p)&&(!s||x.status===s)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));document.getElementById('cards').innerHTML=rows.map(x=>`<article class="card"><div class="top"><h2>${esc(x.name)}</h2><span class="badge ${esc(x.priority)}">${esc(x.priority)}</span></div><div class="meta"><span class="badge">${esc(x.country)}</span><span class="badge">${esc(x.status)}</span><span class="badge">${esc(x.effort)}</span></div><div class="row"><b>Funding:</b> ${esc(x.funding)}</div><div class="row"><b>Deadline:</b> ${esc(x.deadline)}</div><div class="row"><b>Route:</b> ${esc(x.route)}</div><div class="row"><b>First-win fit:</b> ${esc(x.first_win_fit)}</div><div class="next"><b>Next:</b> ${esc(x.next)}</div><div class="source"><a href="${esc(x.source)}" target="_blank" rel="noopener">Official source</a></div></article>`).join('')||'<p>No matching grants.</p>'}fetch('../data/mini-grants.json',{cache:'no-store'}).then(r=>r.json()).then(x=>{D=x.mini_grants||[];document.getElementById('sync').textContent='Updated '+(x.generated_at||'');fill('country',uniq(D.map(x=>x.country)));fill('priority',uniq(D.map(x=>x.priority)));fill('status',uniq(D.map(x=>x.status)));document.getElementById('metrics').innerHTML=[['Tracked',D.length],['P1',D.filter(x=>x.priority==='P1').length],['Slovenia',D.filter(x=>x.country==='Slovenia').length],['Open now',D.filter(x=>String(x.status).startsWith('open')).length]].map(x=>`<div class="metric"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');['q','country','priority','status'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));render()}).catch(()=>document.getElementById('sync').textContent='Data unavailable');</script></body></html>
